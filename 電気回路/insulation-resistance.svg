<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 495" width="680" height="495" font-family="-apple-system, system-ui, 'Segoe UI', 'Yu Gothic UI', 'Noto Sans CJK JP', sans-serif">
  <style>
    text { font-size: 15px; font-weight: 600; fill: #333; }
    .small { font-size: 12.5px; font-weight: 500; }
    .ins-t { fill: #b4500f; }
    .gnd-t { fill: #0a6b41; }
    .conductor { stroke: #333; stroke-width: 4; fill: none; stroke-linecap: round; }
    .wire { stroke: #333; stroke-width: 2.5; fill: none; }
    .leader { stroke: #777; stroke-width: 1; }
    .ins { stroke: #b4500f; stroke-width: 2.5; fill: none; stroke-dasharray: 5 4; }
    .gnd { stroke: #0a6b41; stroke-width: 2.5; fill: none; stroke-dasharray: 5 4; }
    .ins-box { stroke: #b4500f; stroke-width: 2.5; fill: #fff; }
    .gnd-box { stroke: #0a6b41; stroke-width: 2.5; fill: #fff; }
    .ins-dot { fill: #b4500f; }
    .gnd-dot { fill: #0a6b41; }
  </style>

  <!-- background: fixed so the labels stay readable in any theme -->
  <rect width="680" height="495" rx="8" fill="#fff"/>

  <!-- earth -->
  <rect x="14" y="330" width="652" height="125" fill="#efe6d6"/>
  <line x1="14" y1="330" x2="666" y2="330" stroke="#8a6d3b" stroke-width="2.5"/>
  <text x="60" y="400">大地</text>

  <!-- metal case of the equipment -->
  <rect x="470" y="42" width="170" height="168" rx="4" fill="#f4f4f4" stroke="#444" stroke-width="2.5"/>
  <text x="555" y="30" text-anchor="middle">機器の金属外箱</text>

  <!-- wire insulation (sheath) -->
  <rect x="90" y="60" width="350" height="20" rx="4" fill="#cfdbe8" stroke="#8aa0b8"/>
  <rect x="90" y="160" width="350" height="20" rx="4" fill="#cfdbe8" stroke="#8aa0b8"/>

  <!-- conductors, source and load -->
  <path class="conductor" d="M50,70 H545"/>
  <path class="conductor" d="M50,170 H545"/>
  <path class="wire" d="M50,70 V100 M50,140 V170"/>
  <circle cx="50" cy="120" r="20" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="50" y="126" text-anchor="middle">~</text>
  <text x="78" y="125">電源</text>
  <path class="wire" d="M545,70 V97 M545,143 V170"/>
  <rect x="534" y="97" width="22" height="46" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="565" y="125">負荷</text>
  <text class="small" x="555" y="195" text-anchor="middle">線間を測るときは外す</text>

  <!-- wire labels -->
  <text class="small" x="120" y="40" text-anchor="middle">被覆（絶縁物）</text>
  <line class="leader" x1="120" y1="46" x2="120" y2="60"/>
  <text class="small" x="340" y="40" text-anchor="middle">導体（電線の芯）</text>
  <line class="leader" x1="340" y1="46" x2="340" y2="68"/>

  <!-- insulation resistance: line to line -->
  <path class="ins" d="M170,70 V97 M170,143 V170"/>
  <rect class="ins-box" x="159" y="97" width="22" height="46"/>
  <circle class="ins-dot" cx="170" cy="70" r="4"/>
  <circle class="ins-dot" cx="170" cy="170" r="4"/>
  <text class="ins-t" x="190" y="115">絶縁抵抗（線間）</text>
  <text class="small ins-t" x="190" y="133">電線と電線の間・大きいほど良い</text>

  <!-- insulation resistance: line to earth -->
  <path class="ins" d="M300,170 V227 M300,273 V330"/>
  <rect class="ins-box" x="289" y="227" width="22" height="46"/>
  <circle class="ins-dot" cx="300" cy="170" r="4"/>
  <circle class="ins-dot" cx="300" cy="330" r="4"/>
  <text class="ins-t" x="320" y="245">絶縁抵抗（対地間）</text>
  <text class="small ins-t" x="320" y="263">電線と大地の間・大きいほど良い</text>

  <!-- grounding wire and electrode -->
  <path class="wire" d="M555,210 V330"/>
  <text class="small" x="567" y="275">接地線</text>
  <line x1="555" y1="330" x2="555" y2="365" stroke="#333" stroke-width="7"/>
  <text class="small" x="543" y="352" text-anchor="end">接地極</text>

  <!-- grounding resistance -->
  <path class="gnd" d="M555,365 V375 M555,421 V440"/>
  <rect class="gnd-box" x="544" y="375" width="22" height="46"/>
  <circle class="gnd-dot" cx="555" cy="440" r="4"/>
  <text class="gnd-t" x="533" y="388" text-anchor="end">接地抵抗</text>
  <text class="small gnd-t" x="533" y="406" text-anchor="end">接地極と大地の間</text>
  <text class="small gnd-t" x="533" y="423" text-anchor="end">小さいほど良い</text>

  <!-- legend -->
  <text class="small" x="340" y="480" text-anchor="middle">点線の抵抗は、絶縁物や大地との接触を抵抗に見立てたもの（実際に部品が付いているわけではない）</text>
</svg>
