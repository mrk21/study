<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 515" width="880" height="515" font-family="-apple-system, system-ui, 'Segoe UI', 'Yu Gothic UI', 'Noto Sans CJK JP', sans-serif">
  <style>
    text { font-size: 13px; font-weight: 500; fill: #333; }
    .h { font-size: 15px; font-weight: 700; fill: #1b3a5c; }
    .b { font-weight: 700; }
    .small { font-size: 12px; fill: #555; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .wire { stroke: #222; stroke-width: 2.5; fill: none; }
    .line { stroke: #2563c7; stroke-width: 2.5; fill: none; }
    .zbox { fill: #fff; stroke: #c7601e; stroke-width: 2; }
    .z { font-weight: 700; fill: #c7601e; text-anchor: middle; dominant-baseline: central; }
    .il { font-weight: 700; fill: #2563c7; }
    .ip { font-weight: 700; fill: #c7601e; }
    .dim { stroke: #7c8aa0; stroke-width: 1.2; fill: none; }
    .dash { stroke: #7c8aa0; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .step { fill: #f6f8fb; stroke: #7c8aa0; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ah-line" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563c7"/>
    </marker>
    <marker id="ah-dim" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c8aa0"/>
    </marker>
    <g id="common">
      <path class="line" d="M190,18 V62" marker-end="url(#ah-line)"/>
      <path class="line" d="M16,260 H72" marker-end="url(#ah-line)"/>
      <path class="line" d="M364,260 H308" marker-end="url(#ah-line)"/>
      <text class="end" x="178" y="32">線 1</text>
      <text x="16" y="250">線 2</text>
      <text class="end" x="364" y="250">線 3</text>
      <path class="dash" d="M80,268 V306 M300,268 V306"/>
      <path class="dim" d="M86,300 H294" marker-start="url(#ah-dim)" marker-end="url(#ah-dim)"/>
      <text class="mid" x="190" y="292">線と線の間は 200 V</text>
    </g>
  </defs>

  <!-- background: fixed so the colors stay readable in any theme -->
  <rect width="880" height="515" rx="8" fill="#fff"/>
  <line x1="440" y1="12" x2="440" y2="350" stroke="#d5dbe3"/>

  <!-- Y connection -->
  <text class="h" x="20" y="28">Y 結線（始動に使う）</text>
  <g transform="translate(20,40)">
    <path class="wire" d="M190,70 V196.7 M80,260 L190,196.7 M300,260 L190,196.7"/>
    <rect class="zbox" x="-20" y="-9" width="40" height="18" transform="translate(190 133) rotate(90)"/>
    <text class="z" x="190" y="133">Z</text>
    <rect class="zbox" x="-20" y="-9" width="40" height="18" transform="translate(135 228.3) rotate(-29.9)"/>
    <text class="z" x="135" y="228.3">Z</text>
    <rect class="zbox" x="-20" y="-9" width="40" height="18" transform="translate(245 228.3) rotate(29.9)"/>
    <text class="z" x="245" y="228.3">Z</text>
    <circle cx="190" cy="70" r="3.5" fill="#222"/>
    <circle cx="80" cy="260" r="3.5" fill="#222"/>
    <circle cx="300" cy="260" r="3.5" fill="#222"/>
    <circle cx="190" cy="196.7" r="3.5" fill="#222"/>
    <use href="#common"/>
    <text class="il" x="202" y="32">線電流 11.5 A</text>
    <text class="small" x="202" y="50">巻線の電流と同じ</text>
    <text class="ip" x="214" y="124">巻線の電圧 115 V（200 ÷ √3）</text>
    <text class="ip" x="214" y="144">巻線の電流 11.5 A</text>
  </g>

  <!-- delta connection -->
  <text class="h" x="460" y="28">Δ 結線（運転に使う。じか入れも同じ）</text>
  <g transform="translate(460,40)">
    <path class="wire" d="M190,70 L80,260 H300 Z"/>
    <rect class="zbox" x="-20" y="-9" width="40" height="18" transform="translate(135 165) rotate(-59.9)"/>
    <text class="z" x="135" y="165">Z</text>
    <rect class="zbox" x="-20" y="-9" width="40" height="18" transform="translate(245 165) rotate(59.9)"/>
    <text class="z" x="245" y="165">Z</text>
    <rect class="zbox" x="-20" y="-9" width="40" height="18" transform="translate(190 260)"/>
    <text class="z" x="190" y="260">Z</text>
    <circle cx="190" cy="70" r="3.5" fill="#222"/>
    <circle cx="80" cy="260" r="3.5" fill="#222"/>
    <circle cx="300" cy="260" r="3.5" fill="#222"/>
    <use href="#common"/>
    <text class="il" x="202" y="32">線電流 20 × √3 ≒ 34.6 A</text>
    <text class="small" x="202" y="50">巻線 2 つの電流が頂点で合わさる</text>
    <text class="ip" x="276" y="150">巻線の電圧 200 V</text>
    <text class="ip" x="276" y="170">巻線の電流 20 A</text>
  </g>

  <text class="il mid" x="440" y="374">電動機も電源も同じで、つなぎ方だけで線電流が 1/3 になる</text>

  <!-- starting sequence -->
  <rect class="step" x="20" y="390" width="260" height="58" rx="8"/>
  <text class="b mid" x="150" y="413">止まっているとき</text>
  <text class="small mid" x="150" y="434">全電圧だと全負荷電流の 4〜8 倍が流れる</text>
  <path d="M286,412 H300 V404 L310,419 L300,434 V426 H286 Z" fill="#7c8aa0"/>
  <rect class="step" x="316" y="390" width="250" height="58" rx="8"/>
  <text class="b mid" x="441" y="413">① 始動中は Y</text>
  <text class="small mid" x="441" y="434">巻線の電圧を下げて、電流を抑える</text>
  <path d="M572,412 H586 V404 L596,419 L586,434 V426 H572 Z" fill="#7c8aa0"/>
  <rect class="step" x="602" y="390" width="258" height="58" rx="8"/>
  <text class="b mid" x="731" y="413">② 回り始めたら Δ に切り換える</text>
  <text class="small mid" x="731" y="434">巻線に 200 V をかけて、本来の力を出す</text>

  <!-- notes -->
  <text class="small" x="20" y="474">Z は巻線 1 つで、計算用に 10 オームと仮定した。どちらの電流も止まっているときの比較で、回り始めると電流は減る。</text>
  <text class="small" x="20" y="494">始動トルクも 1/3 になるので、無負荷や軽い負荷で始動できるものに使う。</text>
</svg>
