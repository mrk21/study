<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="-apple-system, system-ui, 'Segoe UI', 'Yu Gothic UI', 'Noto Sans CJK JP', sans-serif">
  <style>
    text { font-size: 13px; font-weight: 500; fill: #333; }
    .col { font-size: 14px; font-weight: 700; fill: #1b3a5c; text-anchor: middle; }
    .row { font-size: 14px; font-weight: 700; fill: #1b3a5c; }
    .note { font-size: 12px; fill: #555; }
    .label { font-size: 12px; fill: #555; text-anchor: middle; }
    .foot { font-size: 12px; fill: #555; }
    .face { fill: #fff; stroke: #222; stroke-width: 3; }
    .slot { fill: #fff; stroke: #222; stroke-width: 2.5; stroke-linejoin: round; }
    .rule { stroke: #d5dbe3; }
  </style>
  <defs>
    <circle id="face" class="face" r="42"/>
    <path id="ground" class="slot" d="M-9,33 V25 A9,9 0 0 1 9,25 V33 Z"/>
    <rect id="v-right" class="slot" x="11" y="-20" width="8" height="24"/>
    <!-- 125 V: 15 A, T = 15/20 A, L = 20 A -->
    <g id="v15"><rect class="slot" x="-21" y="-22" width="10" height="28"/><use href="#v-right"/></g>
    <g id="vT"><path class="slot" d="M-11,-22 H-21 V-13 H-36 V-5 H-21 V6 H-11 Z"/><use href="#v-right"/></g>
    <g id="vL"><path class="slot" d="M-19,-20 H-10 V3 H-36 V-6 H-19 Z"/><use href="#v-right"/></g>
    <!-- 250 V: 15 A, inward L = 15/20 A -->
    <g id="h15"><rect class="slot" x="-30" y="-14" width="24" height="10"/><rect class="slot" x="6" y="-14" width="24" height="10"/></g>
    <g id="hL"><path class="slot" d="M-32,-14 H-8 V8 H-18 V-4 H-32 Z"/><rect class="slot" x="6" y="-14" width="24" height="10"/></g>
    <!-- three phase -->
    <g id="p3">
      <rect class="slot" x="-24.5" y="-23" width="9" height="26" transform="rotate(15 -20 -10)"/>
      <rect class="slot" x="15.5" y="-23" width="9" height="26" transform="rotate(-15 20 -10)"/>
      <rect class="slot" x="-5" y="6" width="10" height="26"/>
    </g>
    <g id="p3e">
      <rect class="slot" x="-14" y="-31" width="28" height="9"/>
      <rect class="slot" x="-31" y="-11" width="9" height="22"/>
      <rect class="slot" x="22" y="-11" width="9" height="22"/>
      <rect class="slot" x="-5" y="6" width="10" height="26"/>
    </g>
    <!-- locking and twist: arcs -->
    <g id="arc">
      <path class="slot" d="M-23,-19.3 A30,30 0 0 0 -23,19.3 L-15.3,12.9 A20,20 0 0 1 -15.3,-12.9 Z"/>
      <path class="slot" d="M23,-19.3 A30,30 0 0 1 23,19.3 L15.3,12.9 A20,20 0 0 0 15.3,-12.9 Z"/>
    </g>
    <path id="arc-e" class="slot" d="M-15.2,32.6 A36,36 0 0 0 15.2,32.6 L11.4,24.5 A27,27 0 0 1 -11.4,24.5 Z"/>
  </defs>

  <!-- background: fixed so the symbols stay readable in any theme -->
  <rect width="820" height="500" rx="8" fill="#fff"/>

  <text class="col" x="232" y="26">15 A</text>
  <text class="col" x="462" y="26">15 A・20 A 兼用</text>
  <text class="col" x="692" y="26">20 A 専用</text>
  <text class="label" x="180" y="46">接地極なし</text>
  <text class="label" x="285" y="46">接地極付</text>
  <text class="label" x="410" y="46">接地極なし</text>
  <text class="label" x="515" y="46">接地極付</text>
  <text class="label" x="640" y="46">接地極なし</text>
  <text class="label" x="745" y="46">接地極付</text>

  <!-- 125 V -->
  <text class="row" x="20" y="90">125 V</text>
  <text class="note" x="20" y="110">単相 100 V</text>
  <text class="note" x="20" y="128">2 つが平行</text>
  <g transform="translate(180 104)"><use href="#face"/><use href="#v15"/></g>
  <g transform="translate(285 104)"><use href="#face"/><use href="#v15"/><use href="#ground"/></g>
  <g transform="translate(410 104)"><use href="#face"/><use href="#vT"/></g>
  <g transform="translate(515 104)"><use href="#face"/><use href="#vT"/><use href="#ground"/></g>
  <g transform="translate(640 104)"><use href="#face"/><use href="#vL"/></g>
  <g transform="translate(745 104)"><use href="#face"/><use href="#vL"/><use href="#ground"/></g>

  <line class="rule" x1="20" y1="160" x2="800" y2="160"/>

  <!-- 250 V -->
  <text class="row" x="20" y="202">250 V</text>
  <text class="note" x="20" y="222">単相 200 V</text>
  <text class="note" x="20" y="240">2 つが一直線</text>
  <g transform="translate(180 216)"><use href="#face"/><use href="#h15"/></g>
  <g transform="translate(285 216)"><use href="#face"/><use href="#h15"/><use href="#ground"/></g>
  <g transform="translate(410 216)"><use href="#face"/><use href="#hL"/></g>
  <g transform="translate(515 216)"><use href="#face"/><use href="#hL"/><use href="#ground"/></g>
  <text class="note" x="590" y="198">図記号の傍記は「20A 250V」。</text>
  <text class="note" x="590" y="218">L 字は内側に曲がる形。</text>
  <text class="note" x="590" y="238">外側に曲がる形はひっかけの選択肢。</text>

  <line class="rule" x1="20" y1="272" x2="800" y2="272"/>

  <!-- three phase, locking and twist -->
  <text class="col" x="232" y="298">三相 200 V（3P 250 V）</text>
  <text class="col" x="462" y="298">抜け止め形 LK、引掛形 T</text>
  <text class="label" x="180" y="318">接地極なし</text>
  <text class="label" x="285" y="318">接地極付</text>
  <text class="label" x="410" y="318">接地極なし</text>
  <text class="label" x="515" y="318">接地極付</text>
  <text class="row" x="20" y="366">そのほか</text>
  <g transform="translate(180 374)"><use href="#face"/><use href="#p3"/></g>
  <g transform="translate(285 374)"><use href="#face"/><use href="#p3e"/></g>
  <g transform="translate(410 374)"><use href="#face"/><use href="#arc"/></g>
  <g transform="translate(515 374)"><use href="#face"/><use href="#arc"/><use href="#arc-e"/></g>
  <text class="note" x="590" y="352">円弧はプラグをひねるための形。</text>
  <text class="note" x="590" y="372">抜け止め形は普通のプラグ、</text>
  <text class="note" x="590" y="392">引掛形は専用のプラグを使う。</text>

  <text class="foot" x="20" y="442">下の丸い穴が接地極。三相の接地極付は 4 つの穴のうち一番下、円弧形は下の弧が接地極。</text>
  <text class="foot" x="20" y="464">図記号の傍記がなければ 125 V 15 A。「250V」「20A」「E」「3P」「LK」「T」があれば、その形を選ぶ。</text>
  <text class="foot" x="20" y="486">過去問の図とスライドをもとにした模式図で、寸法は正確ではない。</text>
</svg>
