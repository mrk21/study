<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system, system-ui, 'Segoe UI', 'Yu Gothic UI', 'Noto Sans CJK JP', sans-serif">
  <style>
    text { font-size: 13px; font-weight: 500; fill: #333; }
    .h { font-size: 15px; font-weight: 700; fill: #1b3a5c; }
    .b { font-weight: 700; }
    .small { font-size: 12px; fill: #555; }
    .tick { font-size: 12px; fill: #666; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .grid { stroke: #e3e7ed; stroke-width: 1; }
    .axis { stroke: #9aa5b5; stroke-width: 1; }
    .load { stroke: #0b62a4; stroke-width: 2; fill: none; stroke-linejoin: round; }
    .energy { fill: #0b62a4; fill-opacity: 0.12; }
    .cap { stroke: #444; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .peak { stroke: #444; stroke-width: 1.5; stroke-dasharray: 2 4; }
    .avg { stroke: #444; stroke-width: 1.5; stroke-dasharray: 10 4 2 4; }
    .rule { stroke: #d5dbe3; }
  </style>

  <!-- background: fixed so the figure stays readable in any theme -->
  <rect width="880" height="400" rx="8" fill="#fff"/>

  <text class="h" x="20" y="30">1 日の需要電力の例（設備容量 10 kW の需要家）</text>
  <text class="small" x="80" y="56" text-anchor="end">kW</text>
  <line class="grid" x1="90" y1="320.0" x2="600" y2="320.0"/><text class="tick" x="80" y="324.0" text-anchor="end">0</text><line class="grid" x1="90" y1="270.0" x2="600" y2="270.0"/><text class="tick" x="80" y="274.0" text-anchor="end">2</text><line class="grid" x1="90" y1="220.0" x2="600" y2="220.0"/><text class="tick" x="80" y="224.0" text-anchor="end">4</text><line class="grid" x1="90" y1="170.0" x2="600" y2="170.0"/><text class="tick" x="80" y="174.0" text-anchor="end">6</text><line class="grid" x1="90" y1="120.0" x2="600" y2="120.0"/><text class="tick" x="80" y="124.0" text-anchor="end">8</text><line class="grid" x1="90" y1="70.0" x2="600" y2="70.0"/><text class="tick" x="80" y="74.0" text-anchor="end">10</text>
  <line class="axis" x1="90" y1="320" x2="600" y2="320"/>
  <text class="tick mid" x="90.0" y="340">0</text><text class="tick mid" x="217.5" y="340">6</text><text class="tick mid" x="345.0" y="340">12</text><text class="tick mid" x="472.5" y="340">18</text><text class="tick mid" x="600.0" y="340">24</text>
  <text class="small mid" x="345.0" y="362">時刻（時）</text>

  <path class="energy" d="M90.0,320.0 L90.0,282.5 L111.2,287.5 L132.5,290.0 L153.8,290.0 L175.0,287.5 L196.2,280.0 L217.5,260.0 L238.8,235.0 L260.0,245.0 L281.2,250.0 L302.5,252.5 L323.8,247.5 L345.0,240.0 L366.2,245.0 L387.5,247.5 L408.8,245.0 L430.0,240.0 L451.2,215.0 L472.5,185.0 L493.8,170.0 L515.0,180.0 L536.2,205.0 L557.5,235.0 L578.8,265.0 L600.0,282.5 L600.0,320.0 Z"/>
  <path class="load" d="M90.0,282.5 L111.2,287.5 L132.5,290.0 L153.8,290.0 L175.0,287.5 L196.2,280.0 L217.5,260.0 L238.8,235.0 L260.0,245.0 L281.2,250.0 L302.5,252.5 L323.8,247.5 L345.0,240.0 L366.2,245.0 L387.5,247.5 L408.8,245.0 L430.0,240.0 L451.2,215.0 L472.5,185.0 L493.8,170.0 L515.0,180.0 L536.2,205.0 L557.5,235.0 L578.8,265.0 L600.0,282.5"/>

  <line class="cap" x1="90" y1="70.0" x2="600" y2="70.0"/>
  <text class="b end" x="594" y="62.0">設備容量 10 kW（定格の合計）</text>
  <line class="peak" x1="90" y1="170.0" x2="600" y2="170.0"/>
  <circle cx="493.8" cy="170.0" r="5" fill="#0b62a4" stroke="#fff" stroke-width="2"/>
  <text class="b" x="98" y="162.0">最大需要電力 6 kW</text>
  <line class="avg" x1="90" y1="245.0" x2="600" y2="245.0"/>
  <text class="b" x="98" y="237.0">平均需要電力 3 kW</text>
  <text class="small" x="351.4" y="300.0">色の面積が 1 日の電力量</text>

  <line class="rule" x1="628" y1="56" x2="628" y2="350"/>
  <text class="h" x="648" y="84">需要率</text>
  <text x="648" y="110">最大需要電力 ÷ 設備容量</text>
  <text x="648" y="134">= 6 ÷ 10 = <tspan class="b">60 %</tspan></text>
  <text class="small" x="648" y="156">全部が同時に定格で動くことは少ない</text>

  <text class="h" x="648" y="210">負荷率</text>
  <text x="648" y="236">平均需要電力 ÷ 最大需要電力</text>
  <text x="648" y="260">= 3 ÷ 6 = <tspan class="b">50 %</tspan></text>
  <text class="small" x="648" y="282">使い方が平らなほど 100 % に近い</text>

  <text class="small" x="20" y="384">数値は説明用に作った例。平均需要電力は 1 日の電力量を 24 時間で割った値。</text>
</svg>
