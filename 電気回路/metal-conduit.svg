<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="-apple-system, system-ui, 'Segoe UI', 'Yu Gothic UI', 'Noto Sans CJK JP', sans-serif">
  <style>
    text { font-size: 13px; font-weight: 500; fill: #333; }
    .h { font-size: 14px; font-weight: 700; fill: #1b3a5c; }
    .ok { font-size: 15px; font-weight: 700; fill: #0a6b41; }
    .ng { font-size: 15px; font-weight: 700; fill: #b4231a; }
    .small { font-size: 12px; fill: #555; }
    .pipe { fill: #fff; stroke: #5b6675; stroke-width: 8; }
    .pipe-hot { fill: #fff; stroke: #d9480f; stroke-width: 8; }
    .wire-end { fill: #fff; stroke: #222; stroke-width: 2; }
    .mark { stroke: #222; stroke-width: 2; fill: none; }
    .flux { fill: none; stroke: #b4231a; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .tube { fill: #e4e8ee; stroke: #5b6675; stroke-width: 2; }
    .box { fill: #f6f8fb; stroke: #5b6675; stroke-width: 2; }
    .wire { stroke: #222; stroke-width: 2.5; fill: none; }
    .wire2 { stroke: #8a4b1f; stroke-width: 2.5; fill: none; }
    .bushing { fill: #f08c2e; stroke: #a84a0c; }
    .leader { stroke: #777; stroke-width: 1; }
    .divider { stroke: #d5dbe3; }
  </style>
  <defs>
    <g id="out"><circle class="wire-end" r="11"/><circle r="3" fill="#222"/></g>
    <g id="in"><circle class="wire-end" r="11"/><path class="mark" d="M-6,-6 L6,6 M-6,6 L6,-6"/></g>
  </defs>

  <!-- background: fixed so the labels stay readable in any theme -->
  <rect width="800" height="440" rx="8" fill="#fff"/>
  <line class="divider" x1="400" y1="40" x2="400" y2="420"/>
  <line class="divider" x1="20" y1="226" x2="780" y2="226"/>

  <text class="h" x="24" y="28">交流の 1 回路（行きと帰り）の入れ方：管の断面</text>

  <!-- same conduit -->
  <circle class="pipe" cx="200" cy="105" r="50"/>
  <use href="#out" x="180" y="105"/>
  <use href="#in" x="220" y="105"/>
  <text class="ok" x="24" y="186">○ 1 回路の電線を全部同じ管に</text>
  <text x="24" y="208">磁界の向きが反対で打ち消し合う（電磁的平衡）</text>

  <!-- separate conduits -->
  <circle class="pipe-hot" cx="520" cy="105" r="42"/>
  <use href="#out" x="520" y="105"/>
  <circle class="flux" cx="520" cy="105" r="26"/>
  <circle class="pipe-hot" cx="660" cy="105" r="42"/>
  <use href="#in" x="660" y="105"/>
  <circle class="flux" cx="660" cy="105" r="26"/>
  <text class="ng" x="420" y="186">× 行きと帰りを別々の管に</text>
  <text x="420" y="208">磁界が残り、うず電流で管が過熱する。うなりも出る</text>

  <text class="h" x="24" y="252">電線をつなぐ場所</text>

  <!-- joint in a box -->
  <rect class="box" x="44" y="284" width="96" height="84"/>
  <rect class="tube" x="140" y="309" width="210" height="34"/>
  <path class="wire" d="M92,318 H350"/>
  <path class="wire2" d="M92,334 H350"/>
  <path class="wire" d="M52,300 H82 L92,318"/>
  <path class="wire2" d="M52,352 H82 L92,334"/>
  <circle cx="92" cy="318" r="5" fill="#0a6b41"/>
  <circle cx="92" cy="334" r="5" fill="#0a6b41"/>
  <rect class="bushing" x="134" y="302" width="12" height="48"/>
  <text class="small" x="44" y="278">ボックス</text>
  <line class="leader" x1="140" y1="302" x2="160" y2="282"/>
  <text class="small" x="164" y="282">ブッシング（被覆を保護）</text>
  <text class="ok" x="24" y="396">○ 接続はボックスの中で</text>

  <!-- joint in a conduit -->
  <rect class="tube" x="430" y="309" width="330" height="34"/>
  <path class="wire" d="M430,318 H760"/>
  <path class="wire2" d="M430,334 H760"/>
  <circle cx="595" cy="318" r="6" fill="#b4231a"/>
  <path d="M580,296 L610,356 M610,296 L580,356" stroke="#b4231a" stroke-width="3" fill="none"/>
  <text class="small" x="430" y="282">金属管</text>
  <text class="ng" x="420" y="396">× 管の中で接続しない</text>
  <text x="420" y="418">点検できず、発熱や絶縁不良に気づけない</text>
</svg>
