<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="-apple-system, system-ui, 'Segoe UI', 'Yu Gothic UI', 'Noto Sans CJK JP', sans-serif">
  <style>
    text { font-size: 13px; font-weight: 500; fill: #333; }
    .h { font-size: 14px; font-weight: 700; fill: #1b3a5c; }
    .label { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .note { font-size: 12px; fill: #555; }
    .series { font-size: 12px; font-weight: 700; fill: #b4500f; }
    .parallel { font-size: 12px; font-weight: 700; fill: #0b62a4; }
    .formula { font-size: 14px; font-weight: 700; fill: #b4500f; }
    .wire { stroke: #222; stroke-width: 2.5; fill: none; }
    .wire-parallel { stroke: #0b62a4; stroke-width: 2.5; fill: none; }
    .sym { stroke: #222; stroke-width: 2.5; fill: #fff; }
    .divider { stroke: #d5dbe3; }
    .meter-box { fill: none; stroke: #7c8aa0; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .coil-series { fill: #fff; stroke: #b4500f; stroke-width: 2.5; }
    .coil-parallel { fill: #fff; stroke: #0b62a4; stroke-width: 2.5; }
  </style>
  <defs>
    <g id="base">
      <path class="wire" d="M40,60 H320 V88 M320,132 V160 H40 V128 M40,92 V60"/>
      <circle class="sym" cx="40" cy="110" r="18"/>
      <text class="label" x="40" y="115">~</text>
      <rect class="sym" x="306" y="88" width="28" height="44"/>
      <text class="note" x="342" y="114">負荷</text>
    </g>
  </defs>

  <!-- background: fixed so the labels stay readable in any theme -->
  <rect width="800" height="500" rx="8" fill="#fff"/>
  <path class="divider" d="M400,12 V488 M16,246 H784"/>

  <!-- ammeter -->
  <g transform="translate(14 0)">
    <text class="h" x="10" y="30">電流計：負荷と直列</text>
    <use href="#base"/>
    <circle class="sym" cx="175" cy="60" r="19"/>
    <text class="label" x="175" y="66">A</text>
    <text class="note" x="10" y="192">負荷に流れる電流を、そのまま計器に通す</text>
  </g>

  <!-- voltmeter -->
  <g transform="translate(410 0)">
    <text class="h" x="10" y="30">電圧計：負荷と並列</text>
    <use href="#base"/>
    <path class="wire-parallel" d="M200,60 V91 M200,129 V160"/>
    <circle cx="200" cy="60" r="4" fill="#0b62a4"/>
    <circle cx="200" cy="160" r="4" fill="#0b62a4"/>
    <circle class="sym" cx="200" cy="110" r="19"/>
    <text class="label" x="200" y="116">V</text>
    <text class="note" x="10" y="192">負荷の両端の電圧を、そのまま計器にかける</text>
  </g>

  <!-- wattmeter -->
  <g transform="translate(14 246)">
    <text class="h" x="10" y="30">電力計：負荷と直列・並列の両方</text>
    <use href="#base"/>
    <rect class="meter-box" x="112" y="40" width="182" height="134" rx="6"/>
    <text class="label" x="134" y="122">W</text>
    <rect class="coil-series" x="132" y="51" width="50" height="18"/>
    <text class="series" x="128" y="88">電流コイル</text>
    <path class="wire-parallel" d="M215,60 V92 M215,128 V160"/>
    <circle cx="215" cy="60" r="4" fill="#0b62a4"/>
    <circle cx="215" cy="160" r="4" fill="#0b62a4"/>
    <rect class="coil-parallel" x="206" y="92" width="18" height="36"/>
    <text class="parallel" x="229" y="114">電圧コイル</text>
    <text class="note" x="10" y="192">電力 ＝ 電流 × 電圧 なので、両方を測る</text>
    <text class="note" x="10" y="210">電流コイルは直列、電圧コイルは並列。点線の中が 1 台の電力計</text>
  </g>

  <!-- power factor -->
  <g transform="translate(410 246)">
    <text class="h" x="10" y="30">力率の測定：3 つの計器を使う</text>
    <use href="#base"/>
    <circle class="sym" cx="92" cy="60" r="18"/>
    <text class="label" x="92" y="66">A</text>
    <rect class="meter-box" x="124" y="40" width="110" height="134" rx="6"/>
    <text class="label" x="150" y="122">W</text>
    <rect class="coil-series" x="136" y="51" width="44" height="18"/>
    <path class="wire-parallel" d="M208,60 V92 M208,128 V160 M262,60 V91 M262,129 V160"/>
    <circle cx="208" cy="60" r="4" fill="#0b62a4"/>
    <circle cx="208" cy="160" r="4" fill="#0b62a4"/>
    <rect class="coil-parallel" x="199" y="92" width="18" height="36"/>
    <circle cx="262" cy="60" r="4" fill="#0b62a4"/>
    <circle cx="262" cy="160" r="4" fill="#0b62a4"/>
    <circle class="sym" cx="262" cy="110" r="18"/>
    <text class="label" x="262" y="116">V</text>
    <text class="formula" x="10" y="196">力率 cos θ ＝ P ÷ (V × I)</text>
    <text class="note" x="10" y="216">単相の場合。V と I で皮相電力、W で有効電力がわかる</text>
  </g>
</svg>
